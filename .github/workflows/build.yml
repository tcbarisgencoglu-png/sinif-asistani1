name: "Tauri Build — Çapraz Platform"

on:
  push:
    branches:
      - main
    paths-ignore:
      - "tanitim/**"
      - "dist/tanitim/**"
      - "*.md"
      - ".gitignore"
      - "LICENSE*"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "tanitim/**"
      - "dist/tanitim/**"
      - "*.md"
      - ".gitignore"
      - "LICENSE*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            artifact_name: "mac-apple-silicon"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            artifact_name: "mac-intel"
          - platform: "ubuntu-22.04"
            args: ""
            artifact_name: "linux"
          - platform: "windows-latest"
            args: "--bundles nsis"
            artifact_name: "windows"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Rust kur
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust önbelleği
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Linux bağımlılıkları
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: npm bağımlılıklarını yükle
        run: npm install

      - name: dist klasörünü hazırla (Linux/Mac)
        if: matrix.platform != 'windows-latest'
        run: |
          mkdir -p dist
          cp index.html dist/
          cp mobile.html dist/
          cp -r css dist/
          cp -r js dist/

      - name: dist klasörünü hazırla (Windows)
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          New-Item -ItemType Directory -Path dist
          Copy-Item index.html dist/
          Copy-Item mobile.html dist/
          Copy-Item -Recurse css dist/
          Copy-Item -Recurse js dist/

      - name: Tauri derle (Normal Push)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: ${{ matrix.args }}

      - name: Tauri derle ve Release oluştur (Etiket Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Sınıf Asistanı ${{ github.ref_name }}"
          releaseBody: |
            ### 🚀 Bu Sürümdeki Yenilikler (${{ github.ref_name }}):
            - 📱 **Mobil Cep Asistanı:** Derste ayakta ve tek elle kullanıma uygun, masaüstünden bağımsız yeni mobil sürüm (`mobile.html`).
            - 🚶‍♂️ **Seri Sıra Gezme (Ödev Takibi):** Masaları gezerken tek dokunuşla ödev kontrolü ve otomatik sonraki öğrenciye geçiş.
            - ⚡ **Hızlı Dojo & Yoklama:** Mobil ekranda titreşimli geri bildirimle tek dokunuşla puan verme ve yoklama tamamlama.
            - 🤖 **Android Uygulaması (.apk):** Telefonlara doğrudan indirilip kurulabilen Android paket desteği (`sinif-asistani.apk`).
            - 🎨 **Masaüstü Arayüz İyileştirmeleri:** Ders materyalleri yerleşimi ve açılır seçim menülerindeki metin kesilme sorunları giderildi.

            ---
            🛡️ **Veri Güvenliği:** Güncelleme yaptığınızda mevcut sınıflarınız, öğrencileriniz, ders programınız ve tüm verileriniz **kesinlikle silinmez, korunur**.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  build-android:
    name: "Android APK Derle"
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Bağımlılıkları yükle ve dist klasörünü hazırla
        run: |
          npm install
          npm run sync

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle kur ve yapılandır
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Android APK Derle
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: APK Dosyasını Hazırla
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/sinif-asistani.apk

      - name: APK'yı Artifact Olarak Kaydet (Push)
        uses: actions/upload-artifact@v4
        with:
          name: sinif-asistani-android-apk
          path: artifacts/sinif-asistani.apk

      - name: Release'e APK Ekle (Etiket Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/sinif-asistani.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
