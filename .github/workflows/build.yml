name: "Tauri Build — Çapraz Platform"

on:
  push:
    branches:
      - main
    paths-ignore:
      - "tanitim/**"
      - "dist/tanitim/**"
      - "*.md"
      - ".gitignore"
      - "LICENSE*"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "tanitim/**"
      - "dist/tanitim/**"
      - "*.md"
      - ".gitignore"
      - "LICENSE*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            artifact_name: "mac-apple-silicon"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            artifact_name: "mac-intel"
          - platform: "ubuntu-22.04"
            args: ""
            artifact_name: "linux"
          - platform: "windows-latest"
            args: "--bundles nsis"
            artifact_name: "windows"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Rust kur
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust önbelleği
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Linux bağımlılıkları
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: npm bağımlılıklarını yükle
        run: |
          npm install
          npx tauri --version || npm install --force -D @tauri-apps/cli
          npx tauri --version

      - name: dist klasörünü hazırla (Linux/Mac)
        if: matrix.platform != 'windows-latest'
        run: |
          mkdir -p dist
          cp index.html dist/
          cp mobile.html dist/
          cp manifest.json dist/ || true
          cp sw.js dist/ || true
          cp version.json dist/ || true
          cp -r css dist/
          cp -r js dist/
          cp -r icons dist/ || true

      - name: dist klasörünü hazırla (Windows)
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          New-Item -ItemType Directory -Path dist
          Copy-Item index.html dist/
          Copy-Item mobile.html dist/
          if (Test-Path manifest.json) { Copy-Item manifest.json dist/ }
          if (Test-Path sw.js) { Copy-Item sw.js dist/ }
          if (Test-Path version.json) { Copy-Item version.json dist/ }
          Copy-Item -Recurse css dist/
          Copy-Item -Recurse js dist/
          if (Test-Path icons) { Copy-Item -Recurse icons dist/ }

      - name: Tauri derle
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
        run: |
          echo "=== Ortam Bilgileri ==="
          echo "Dizin: $(pwd)"
          echo "Node: $(node -v)"
          echo "NPM: $(npm -v)"
          echo "Rust: $(rustc -V)"
          echo "Cargo: $(cargo -V)"
          echo "Tauri CLI test ediliyor..."
          npx tauri --version
          echo "Derleme baslatiliyor (args: ${{ matrix.args }})..."
          set +e
          npx tauri build ${{ matrix.args }} --no-sign -v 2>&1 | tee tauri-build.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          cp tauri-build.log "error-${{ matrix.artifact_name }}.txt"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "### ❌ Tauri Derleme Hatası (${{ matrix.artifact_name }})" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 60 tauri-build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          fi

      - name: Hata Günlüğünü Kaydet
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-error-${{ matrix.artifact_name }}
          path: error-${{ matrix.artifact_name }}.txt
          if-no-files-found: ignore

      - name: Hata Logunu Release'e Yükle
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.34"
          files: error-${{ matrix.artifact_name }}.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Masaüstü Paketlerini Artifact Olarak Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/macos/*.app.tar.gz
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/deb/*.deb
            src-tauri/target/**/bundle/appimage/*.AppImage
            src-tauri/target/**/bundle/rpm/*.rpm
          if-no-files-found: warn

      - name: Masaüstü Paketlerini Release'e Yükle (Etiket Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Sınıf Asistanı ${{ github.ref_name }}"
          body: |
            ### 🚀 Bu Sürümdeki Yenilikler (${{ github.ref_name }}):
            - 📱 **Mobil Modüler Mimari & Optik Okuma:** Çevrim dışı kamera tabanlı OMR optik form okuyucu ve modüler mobil motor.
            - 🚶‍♂️ **Seri Sıra Gezme (Ödev Takibi):** Masaları gezerken tek dokunuşla ödev kontrolü ve otomatik sonraki öğrenciye geçiş.
            - ⚡ **Hızlı Dojo & Yoklama:** Mobil ekranda titreşimli geri bildirimle tek dokunuşla puan verme ve yoklama tamamlama.
            - 🤖 **Android Uygulaması (.apk):** Telefonlara doğrudan indirilip kurulabilen Android paket desteği (`sinif-asistani.apk`).
            - 🎨 **Masaüstü Arayüz İyileştirmeleri:** Hazine sandığı akıllı tahta tam ekran modu ve canlı ders başlığı düzeltmeleri.

            ---
            🛡️ **Veri Güvenliği:** Güncelleme yaptığınızda mevcut sınıflarınız, öğrencileriniz, ders programınız ve tüm verileriniz **kesinlikle silinmez, korunur**.
          draft: false
          prerelease: false
          files: |
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/macos/*.app.tar.gz
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/deb/*.deb
            src-tauri/target/**/bundle/appimage/*.AppImage
            src-tauri/target/**/bundle/rpm/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: "Android APK Derle"
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Bağımlılıkları yükle ve dist klasörünü hazırla
        run: |
          npm install
          npm run sync

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle kur ve yapılandır
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Android APK Derle
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: APK Dosyasını Hazırla
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/sinif-asistani.apk

      - name: APK'yı Artifact Olarak Kaydet (Push)
        uses: actions/upload-artifact@v4
        with:
          name: sinif-asistani-android-apk
          path: artifacts/sinif-asistani.apk

      - name: Release'e APK Ekle (Etiket Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Sınıf Asistanı ${{ github.ref_name }}"
          body: |
            ### 🚀 Bu Sürümdeki Yenilikler (${{ github.ref_name }}):
            - 📱 **Mobil Modüler Mimari & Optik Okuma:** Çevrim dışı kamera tabanlı OMR optik form okuyucu ve modüler mobil motor.
            - 🚶‍♂️ **Seri Sıra Gezme (Ödev Takibi):** Masaları gezerken tek dokunuşla ödev kontrolü ve otomatik sonraki öğrenciye geçiş.
            - ⚡ **Hızlı Dojo & Yoklama:** Mobil ekranda titreşimli geri bildirimle tek dokunuşla puan verme ve yoklama tamamlama.
            - 🤖 **Android Uygulaması (.apk):** Telefonlara doğrudan indirilip kurulabilen Android paket desteği (`sinif-asistani.apk`).
            - 🎨 **Masaüstü Arayüz İyileştirmeleri:** Hazine sandığı akıllı tahta tam ekran modu ve canlı ders başlığı düzeltmeleri.

            ---
            🛡️ **Veri Güvenliği:** Güncelleme yaptığınızda mevcut sınıflarınız, öğrencileriniz, ders programınız ve tüm verileriniz **kesinlikle silinmez, korunur**.
          draft: false
          prerelease: false
          files: artifacts/sinif-asistani.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
