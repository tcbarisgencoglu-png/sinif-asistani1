name: "Tauri Build — Çapraz Platform"

on:
  push:
    branches:
      - main
    paths-ignore:
      - "tanitim/**"
      - "dist/tanitim/**"
      - "*.md"
      - ".gitignore"
      - "LICENSE*"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "tanitim/**"
      - "dist/tanitim/**"
      - "*.md"
      - ".gitignore"
      - "LICENSE*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            artifact_name: "mac-apple-silicon"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            artifact_name: "mac-intel"
          - platform: "ubuntu-22.04"
            args: ""
            artifact_name: "linux"
          - platform: "windows-latest"
            args: "--bundles nsis"
            artifact_name: "windows"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Rust kur
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust önbelleği
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Linux bağımlılıkları
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: npm bağımlılıklarını yükle
        run: npm install

      - name: dist klasörünü hazırla (Linux/Mac)
        if: matrix.platform != 'windows-latest'
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -r css dist/
          cp -r js dist/

      - name: dist klasörünü hazırla (Windows)
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          New-Item -ItemType Directory -Path dist
          Copy-Item index.html dist/
          Copy-Item -Recurse css dist/
          Copy-Item -Recurse js dist/

      - name: Tauri derle (Normal Push)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: ${{ matrix.args }}

      - name: Tauri derle ve Release oluştur (Etiket Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Sınıf Asistanı ${{ github.ref_name }}"
          releaseBody: |
            ### 🚀 Bu Sürümdeki Yenilikler (${{ github.ref_name }}):
            - Yıllık plan düzenleme ve silme işlemleri için modern arayüz modalı eklendi.
            - Bildirim (toast) sistemi yenilendi; bildirimlerin ekranda takılı kalması ve birikmesi sorunu tamamen giderildi.
            - Sadeleştirilmiş ve veri güvenliği açıklamalı güncelleme bildirim penceresi eklendi.
            - macOS, Windows ve Pardus tahta uyumluluğu ve genel kararlılık artırıldı.

            ---
            🛡️ **Veri Güvenliği:** Güncelleme yaptığınızda mevcut sınıflarınız, öğrencileriniz, ders programınız ve tüm notlarınız **kesinlikle silinmez, korunur**.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
