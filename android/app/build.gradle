plugins {
    id 'com.android.application'
}

import groovy.json.JsonSlurper

def packageJsonFile = file("${project.rootDir}/../package.json")
def pkg = packageJsonFile.exists() ? new JsonSlurper().parse(packageJsonFile) : null
def appVersion = pkg?.version ?: "1.0.31"
def verParts = appVersion.tokenize('.')
def appVersionCode = 31
if (verParts.size() >= 3) {
    try {
        appVersionCode = (verParts[0].toInteger() * 10000) + (verParts[1].toInteger() * 100) + verParts[2].toInteger()
    } catch (Exception e) {
        appVersionCode = 31
    }
}

android {
    namespace 'com.sinifasistani.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.sinifasistani.app"
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName appVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', "${project.rootDir}/../dist"]
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Web varlıklarını derleme öncesinde dist dizininden src/main/assets dizinine otomatik kopyala
tasks.register('syncDistAssets', Sync) {
    from "${project.rootDir}/../dist"
    into "src/main/assets"
}

project.afterEvaluate {
    tasks.matching { it.name.startsWith("merge") && it.name.endsWith("Assets") }.configureEach {
        dependsOn 'syncDistAssets'
    }
    tasks.matching { it.name.startsWith("generate") && it.name.endsWith("Assets") }.configureEach {
        dependsOn 'syncDistAssets'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}
